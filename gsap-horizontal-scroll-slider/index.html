<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <title>Gsap Horizontal Scroll Slider</title>
</head>
<body>
      <nav>
      <div>
        <div> Logo</div>
      </div>
      <div>Horizontal Scroll</div>
    </nav>

    <div class="marker-wrapper">
        <div class="slide-title"></div>
      <div class="marker">
        <div class="grab"></div>
      </div>
      <div class="active-slide">1/10</div>
    </div>

    <div class="slider">
      <div class="slider-wrapper">
        <div class="slide" data-title="First image">
          <img src="https://images.pexels.com/photos/18071152/pexels-photo-18071152.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Second image">
          <img src="https://images.pexels.com/photos/11476544/pexels-photo-11476544.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Third image">
          <img src="https://images.pexels.com/photos/32425095/pexels-photo-32425095.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Fourth image">
          <img src="https://images.pexels.com/photos/25002429/pexels-photo-25002429.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Fifth image">
          <img src="https://images.pexels.com/photos/27927191/pexels-photo-27927191.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Sixth image">
          <img src="https://images.pexels.com/photos/7614299/pexels-photo-7614299.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Seventh image">
          <img src="https://images.pexels.com/photos/1343537/pexels-photo-1343537.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Eightth image">
          <img src="https://images.pexels.com/photos/13084238/pexels-photo-13084238.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Ninth image">
          <img src="https://images.pexels.com/photos/250591/pexels-photo-250591.jpeg" alt="" />
        </div>
        <div class="slide" data-title="Tenth image">
          <img src="https://images.pexels.com/photos/19390867/pexels-photo-19390867.jpeg" alt="" />
        </div>
      </div>
    </div>

    <footer>
      <div>Legal Notice</div>
      <div>Copyright &copy;</div>
    </footer>
    
    <script src="./script.js"></script>
</body>
</html>
