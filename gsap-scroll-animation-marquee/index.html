<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
     <!-- Import Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Gsap Scroll Animation Marquee</title>
</head>
<body>
      <section class="spacer" aria-hidden="true"></section>

    <section class="marquee" aria-label="Scrolling announcements">
      <div class="marquee__inner" id="marqueeTrack"></div>
    </section>

    <section class="spacer" aria-hidden="true"></section>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
      // ================================
      // CONFIG
      // ================================
      // Texts to show in the marquee. You can add multiple phrases if needed.
      const PHRASES = ["Text marquee example"];
      // How many times to repeat the phrase to ensure seamless scrolling.
      // Increase if you see gaps; decrease to lighten DOM.
      const REPEATS = 12;

      // Speed of the marquee animation (seconds for one loop across 100%)
      const DURATION = 5;

      // ================================
      // DOM BUILDING
      // ================================
      const track = document.getElementById("marqueeTrack");

      // Helper: create a single marquee item (text + arrow)
      function createMarqueePart(text) {
        const part = document.createElement("div");
        part.className = "marquee__part";

        // Text node
        const label = document.createTextNode(text + " ");
        part.appendChild(label);

        // Arrow wrapper + icon
        const arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.setAttribute("aria-hidden", "true"); // decorative
        const icon = document.createElement("span");
        icon.className = "material-symbols-outlined";
        icon.textContent = "arrow_right_alt";
        arrow.appendChild(icon);

        part.appendChild(arrow);
        return part;
      }

      // Build enough items to fill the track and allow a smooth infinite loop
      for (let i = 0; i < REPEATS; i++) {
        const phrase = PHRASES[i % PHRASES.length];
        track.appendChild(createMarqueePart(phrase));
      }

      // ================================
      // GSAP MARQUEE
      // ================================
      // Create the infinite horizontal translation:
      // All .marquee__part items move left by 100% continuously
      const tween = gsap.to(".marquee__part", {
        xPercent: -100,
        repeat: -1,
        duration: DURATION,
        ease: "linear"
      }).totalProgress(0.5); // start at the middle of the loop for symmetry

      // Position the track; -100 makes the loop feel centered when starting
      gsap.set(".marquee__inner", { xPercent: -100 });

      // ================================
      // SCROLL DIRECTION INTERACTION
      // ================================
      let currentScroll = window.pageYOffset || 0;
      let isScrollingDown = true;
      const arrows = document.querySelectorAll(".arrow");

      // On scroll, detect direction and:
      // - change tween direction (timeScale 1 forward, -1 backward)
      // - toggle arrow rotation
      window.addEventListener("scroll", () => {
        const y = window.pageYOffset || 0;
        isScrollingDown = y > currentScroll;

        // Play forward when scrolling down, reverse when scrolling up
        gsap.to(tween, { timeScale: isScrollingDown ? 1 : -1 });

        // Rotate arrow based on direction
        arrows.forEach((arrow) => {
          if (isScrollingDown) {
            arrow.classList.remove("active"); // default rotation
          } else {
            arrow.classList.add("active"); // 180° rotation
          }
        });

        currentScroll = y;
      }, { passive: true });
    </script>
</body>
</html>
