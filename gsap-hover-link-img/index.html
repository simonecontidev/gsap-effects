<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <title>Link hover animation</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <nav class="menu">
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/931018/pexels-photo-931018.jpeg"
         data-desc="A tropical landscape in Bali, lush nature.">
      <span class="default">Bali</span><span class="hover">Bali</span>
    </div>
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/33493798/pexels-photo-33493798.jpeg"
         data-desc="The Toco Toucan with its iconic orange beak.">
      <span class="default">Toco Toucan</span><span class="hover">Toco Toucan</span>
    </div>
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/16615370/pexels-photo-16615370.jpeg"
         data-desc="White-crested cockatoo in the foreground.">
      <span class="default">Cockatoo</span><span class="hover">Cockatoo</span>
    </div>
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/31839987/pexels-photo-31839987.jpeg"
         data-desc="The macaw with multicolored plumage.">
      <span class="default">Macaw</span><span class="hover">Macaw</span>
    </div>
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/12715165/pexels-photo-12715165.jpeg"
         data-desc="Blue and yellow macaw in its natural habitat.">
      <span class="default">Ara</span><span class="hover">Ara</span>
    </div>
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/32946752/pexels-photo-32946752.jpeg"
         data-desc="Pteroglossus illigeri, an elegant toucan.">
      <span class="default">Pteroglossus Illiger</span><span class="hover">Pteroglossus Illiger</span>
    </div>
    <div class="menu-item" 
         data-img="https://images.pexels.com/photos/33181298/pexels-photo-33181298.jpeg"
         data-desc="A curious monkey in the forest.">
      <span class="default">Monkey</span><span class="hover">Monkey</span>
    </div>
  </nav>

  <!-- single floating preview -->
  <div class="preview">
    <img alt="" />
    <p></p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
